name: test

env:
  # Common versions
  GO_VERSION: '1.22'
  TZ: Asia/Shanghai

permissions: write-all

on:
  push:
    branches:
      - '*'

jobs:
  build:
    name: "build"
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install global dependencies
        run: |
          npm install -g yarn
          npm install -g electron-forge
      - name: install tools
        run: |
          echo "install tools"
          go install github.com/kevinburke/go-bindata/v4/...@latest
      - name: Release
        run: |
          cd ui && yarn install && cd ..
          cd client && yarn install && cd ..
          make prepare
          make compile_ui
      - name: Release
        run: |
          make default

